<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<title>Рашид Михайлов — сдать квартиру в Москве</title>
<meta name="description" content="Рашид Михайлов, агент по аренде в агентстве Андрея Медведева. Сдать квартиру в Москве и области, собственник комиссию не платит.">
<link rel="icon" href="img/agency.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/apps.css">
<link rel="stylesheet" href="css/ios.css">
<link rel="stylesheet" href="css/mac.css">
<link rel="stylesheet" href="css/games.css">
</head>
<body>

<main id="chooser" class="chooser" hidden>
  <p class="ch-name">Рашид Михайлов</p>
  <h1>Откуда смотрите?</h1>
  <div class="picks">
    <button class="pick" data-mode="ios">
      <span class="pick-art art-phone" aria-hidden="true"><span></span></span>
      <span class="pick-label">С телефона</span>
    </button>
    <button class="pick" data-mode="mac">
      <span class="pick-art art-laptop" aria-hidden="true"><span></span><i></i></span>
      <span class="pick-label">С компьютера</span>
    </button>
  </div>
  <p class="ch-foot">Внутри — мой рабочий телефон или ноутбук. Можно смотреть всё.</p>
</main>

<div id="ios" class="ios-root" hidden></div>
<div id="mac" class="mac-root" hidden></div>

<script src="content.js"></script>
<script src="js/icons.js"></script>
<script src="js/core.js"></script>
<script src="js/games.js"></script>
<script src="js/ios.js"></script>
<script src="js/mac.js"></script>
<script src="js/app.js"></script>
</body>
</html>
